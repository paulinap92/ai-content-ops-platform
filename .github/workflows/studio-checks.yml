name: Content Studio
on:
  push:
    branches: [feature/database-social-studio]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install uv==0.13.4
      - run: uv sync --frozen
        working-directory: content-agent-api
      - run: uv run --frozen python -m pytest -q
        working-directory: content-agent-api
      - run: node --check content-agent-api/static/app.js
