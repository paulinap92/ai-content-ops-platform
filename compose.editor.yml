name: cc-content-editor
services:
  editor:
    build:
      context: ./content-agent-api
    image: canarias-content-editor:local
    ports:
      - "127.0.0.1:${EDITOR_LOCAL_PORT:-8004}:8000"
    env_file:
      - ./content-agent-api/.env
    environment:
      PORT: "8000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
      - /app/output:uid=10001,gid=10001,mode=0750
      - /app/photo_inbox:uid=10001,gid=10001,mode=0750
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health/live',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
