<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Content Editor · Logowanie</title><meta name="robots" content="noindex,nofollow"><style>body{margin:0;background:#f3f6f4;color:#183b32;font:16px system-ui}main{max-width:450px;margin:12vh auto;padding:32px;background:white;border:1px solid #d7e0dc;border-radius:16px}h1{margin:8px 0 20px}small{letter-spacing:.15em}label,input,button{display:block}input{box-sizing:border-box;width:100%;padding:14px;margin:8px 0 20px;border:1px solid #a9bdb5;border-radius:8px;font:inherit}button{padding:12px 20px;border:0;background:#183b32;color:white;border-radius:8px;font:inherit;cursor:pointer}p{line-height:1.5}#message{color:#a93620}@media(max-width:550px){main{margin:8vh 16px;padding:24px}}</style></head><body><main><small>CANARIAS CERCA</small><h1>Content Editor</h1><p>Jedna aplikacja do edycji strony, pracy z AI i przygotowania publikacji.</p><form id="form"><label>Klucz Editora<input id="key" type="password" autocomplete="current-password" required maxlength="512"></label><button>Zaloguj</button></form><p id="message" role="status"></p></main><script>document.getElementById('form').onsubmit=async(e)=>{e.preventDefault();const key=document.getElementById('key'),message=document.getElementById('message');try{const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:key.value})});const d=await r.json();if(!r.ok)throw Error(d.detail||'Nie udało się zalogować.');location.replace('/');}catch(e){message.textContent=e.message;}finally{key.value='';}};</script></body></html>
